[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bugjar"
version = "1.0.0"
description = "Record, replay, verify and shrink a failing command in one portable cassette"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["reproducibility", "debugging", "cassette", "delta-debugging", "bug-report"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.scripts]
bugjar = "bugjar.cli:main"

[tool.setuptools]
packages = ["bugjar"]

[tool.setuptools.package-data]
bugjar = ["py.typed"]
